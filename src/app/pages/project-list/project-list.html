<div class="page">
  <h1>Hello, {{ storage.userName() }}</h1>

  <div class="create-box">
    <input
      type="text"
      placeholder="Project name"
      [ngModel]="projectName()"
      (ngModelChange)="projectName.set($event)"
    />

    <button (click)="createProject()">Create Project</button>
  </div>

  <h2>Your Projects</h2>

  @if (storage.projects().length === 0) {
    <p>No projects yet. Create your first project.</p>
  }

  <div class="project-list">
    @for (project of storage.projects(); track project.id) {
      <div class="project-card" (click)="openProject(project.id)">
        <h3>{{ project.name }}</h3>
        <p>Total Tasks: {{ project.tasks.length }}</p>
        <p>Columns: {{ project.columns.length }}</p>
      </div>
    }
  </div>
</div>
