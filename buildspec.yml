version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies and security scanners..."
      # Install Gitleaks (Secret Detection)
      - wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
      - tar -zxvf gitleaks_8.18.2_linux_x64.tar.gz
      - chmod +x gitleaks
      - mv gitleaks /usr/local/bin/
      
      # Install Semgrep (SAST) via Python pip
      - pip3 install semgrep

      # Install project dependencies using clean install (SCA will run on package-lock.json)
      - npm ci --legacy-peer-deps

  pre_build:
    commands:
      - echo "Running Gitleaks (Secret Detection)..."
      # Run gitleaks on the current workspace repository
      - gitleaks detect --source=. --verbose --redact

  build:
    commands:
      - echo "Running SCA (Software Composition Analysis)..."
      # Run npm audit. --audit-level=high fails the build if high or critical vulnerabilities exist.
      - npm audit --audit-level=high

      - echo "Running SAST (Static Application Security Testing)..."
      # Run semgrep scan. --error makes it return a non-zero exit code if rules match.
      - semgrep scan --config=auto --error

  post_build:
    commands:
      - echo "All security checks passed successfully!"
